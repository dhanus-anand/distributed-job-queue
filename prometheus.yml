global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'djq-server'
    static_configs:
      - targets: ['server:8080']
    metrics_path: /metrics

  - job_name: 'djq-worker-1'
    static_configs:
      - targets: ['worker-1:9091']
    metrics_path: /metrics

  - job_name: 'djq-worker-2'
    static_configs:
      - targets: ['worker-2:9092']
    metrics_path: /metrics

  - job_name: 'djq-worker-3'
    static_configs:
      - targets: ['worker-3:9093']
    metrics_path: /metrics
