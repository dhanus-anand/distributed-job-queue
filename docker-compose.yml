version: '3.9'

services:
  redis:
    image: redis:7-alpine
    container_name: djq-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: djq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-djq_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-djq_password}
      POSTGRES_DB: ${POSTGRES_DB:-djq_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-djq_user}']
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: djq-server
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-djq_user}:${POSTGRES_PASSWORD:-djq_password}@postgres:5432/${POSTGRES_DB:-djq_db}
      PORT: 8080
    ports:
      - '8080:8080'

  worker-1:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: djq-worker-1
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-djq_user}:${POSTGRES_PASSWORD:-djq_password}@postgres:5432/${POSTGRES_DB:-djq_db}
      WORKER_ID: worker-1
      WORKER_CONCURRENCY: 10
      METRICS_PORT: 9091
    ports:
      - '9091:9091'

  worker-2:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: djq-worker-2
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-djq_user}:${POSTGRES_PASSWORD:-djq_password}@postgres:5432/${POSTGRES_DB:-djq_db}
      WORKER_ID: worker-2
      WORKER_CONCURRENCY: 10
      METRICS_PORT: 9092
    ports:
      - '9092:9092'

  worker-3:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: djq-worker-3
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-djq_user}:${POSTGRES_PASSWORD:-djq_password}@postgres:5432/${POSTGRES_DB:-djq_db}
      WORKER_ID: worker-3
      WORKER_CONCURRENCY: 10
      METRICS_PORT: 9093
    ports:
      - '9093:9093'

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: djq-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - '9090:9090'

  grafana:
    image: grafana/grafana:11.1.0
    container_name: djq-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
    ports:
      - '3001:3000'

volumes:
  redis_data:
  postgres_data:
  prometheus_data:
  grafana_data:
